<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Resume — Zaijing Liu</title>
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">
        <span class="brand__name">Zaijing Liu</span>
        <span class="brand__sep">/</span>
        <span class="brand__role">UX Research</span>
      </a>
      <nav class="nav">
        <a class="nav__link" href="index.html">Home</a>
        <a class="nav__link" href="about.html">About</a>
        <a class="nav__link" href="resume.html">Resume<span class="bar"></span></a>
      </nav>
    </div>
  </header>

  <main class="wrap page">

    <section class="resume-head no-print">
      <div>
        <div class="eyebrow">Resume</div>
        <h1>My Resume</h1>
        <p>A one-page overview of my experience, research methods, skills, and education. Switch between the versions tailored to each role.</p>
      </div>
      <a class="btn btn--lg" id="resume-download" href="Researcher-Zaijing Liu Resume.pdf" download>
        <span>↓</span> Download PDF
      </a>
    </section>

    <!-- Tabs -->
    <div class="resume-tabs no-print" role="tablist" aria-label="Resume versions">
      <button class="resume-tab is-active" type="button" role="tab" aria-selected="true"
              data-pdf="Researcher-Zaijing Liu Resume.pdf">Researcher</button>
      <button class="resume-tab" type="button" role="tab" aria-selected="false"
              data-pdf="Human Factor Engineer-Zaijing Liu Resume.pdf">Human Factors Engineer</button>
    </div>

    <!-- Live PDF preview -->
    <div class="resume-sheet">
      <iframe id="resume-frame" src="Researcher-Zaijing Liu Resume.pdf#view=FitH&toolbar=0&navpanes=0" title="Zaijing Liu resume"></iframe>
      <div class="resume-sheet__foot no-print">
        <a id="resume-foot" href="Researcher-Zaijing Liu Resume.pdf" download>Download the PDF →</a>
      </div>
    </div>

  </main>

  <script>
    (function () {
      var tabs  = document.querySelectorAll('.resume-tab');
      var frame = document.getElementById('resume-frame');
      var dl    = document.getElementById('resume-download');
      var foot  = document.getElementById('resume-foot');

      function select(tab) {
        var pdf = tab.getAttribute('data-pdf');
        var href = encodeURI(pdf);
        frame.src = href + '#view=FitH&toolbar=0&navpanes=0';
        dl.href = href;
        foot.href = href;

        tabs.forEach(function (t) {
          var on = t === tab;
          t.classList.toggle('is-active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      }

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () { select(tab); });
      });
    })();
  </script>

</body>
</html>
